<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div.container{
            border: 3px solid blue;
            display: grid;
            height: 550px;

            grid-template: repeat(3, 100px) / repeat(5, 100px);
            gap: 10px;

            place-items: normal normal;
            place-content: normal normal;
        }

        .item{
            border: 1px solid red;
        }

        #item1{
            grid-row-start: 1;
            grid-row-end: 2;
            grid-column-start: 1;
            grid-column-end: 5;
        }

        #item2{
            grid-row-start: 2;
            grid-row-end: 4;
            grid-column-start: 1;
            grid-column-end: 3;
        }

        #item3{
            grid-row-start: 2;
            grid-row-end: 4;
            grid-column-start: 3;
            grid-column-end: 5;
        }

    </style>
</head>
<body>
        <div class="container">
            <div class="item" id="item1">A</div>
            <div class="item" id="item2">B</div>
            <div class="item" id="item3">C</div>

        </div>
</body>
</html>
