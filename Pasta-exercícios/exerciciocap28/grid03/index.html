<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div.container{
            border: 3px solid blue;
            display: grid;
            height: 100vh;
            width: 100vw;

            grid-template-rows: 80px 40px 1fr 40px;
            grid-template-columns: 1fr 150px;
            gap: 10px;

            place-items: normal normal;
            place-content: normal normal;
        }

        .item{
            border: 1px solid red;
            text-align: center;
        }

        #topo{
            grid-area: 1 / 1 / 2 / 3;
        }

        #menu{
            grid-area: 2 / 1 / 3 / 3;
        }

        #principal{
            grid-area: 3 / 1 / 4 / 2;
        }

        #secundario{
            grid-area: 3 / 2 / 4 / 3;
        }

        #rodape{
            grid-area: 4 / 1 / 5 / 3;
        }

    </style>
</head>
<body>

    <h1>grid03</h1>
    
        <div class="container">
            <div class="item" id="topo">Topo</div>
            <div class="item" id="menu">Menu</div>
            <div class="item" id="principal">Principal</div>
            <div class="item" id="secundario">Secundário</div>
            <div class="item" id="rodape">Rodapé</div>

        </div>
</body>
</html>
